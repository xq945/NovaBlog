# Docker 环境配置（覆盖 application.yml 中的 Docker 服务地址）
# 敏感值（密码/密钥）通过 docker-compose 环境变量传入
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/novablog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 0

# JWT
jwt:
  secret: ${NOVABLOG_JWT_SECRET}
  access-expiration: 7200000
  refresh-expiration: 604800000

# 默认启用 Knife4j
knife4j:
  enable: true
