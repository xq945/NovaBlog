# NovaBlog Docker Compose
# 一键启动：docker compose up -d
# 停止：     docker compose down
# 查看日志： docker compose logs -f

services:
  mysql:
    image: mysql:8.0
    container_name: novablog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: novablog
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - novablog-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: novablog-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - novablog-net

  app:
    build:
      context: ./novablog-server
      dockerfile: Dockerfile
    container_name: novablog-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123456}
      - NOVABLOG_JWT_SECRET=${NOVABLOG_JWT_SECRET}
      # 可选：阿里云 OSS（文件上传）
      - ALIYUN_OSS_ENDPOINT=${ALIYUN_OSS_ENDPOINT:-}
      - ALIYUN_OSS_BUCKET=${ALIYUN_OSS_BUCKET:-}
      - ALIYUN_OSS_ACCESS_KEY_ID=${ALIYUN_OSS_ACCESS_KEY_ID:-}
      - ALIYUN_OSS_ACCESS_KEY_SECRET=${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      # 可选：AI / RAG（默认为关闭）
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_CHAT_PROVIDER=${AI_CHAT_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AI_EMBEDDING_PROVIDER=${AI_EMBEDDING_PROVIDER:-bailian}
      - BAILIAN_API_KEY=${BAILIAN_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - novablog-net

volumes:
  mysql-data:
  redis-data:

networks:
  novablog-net:
